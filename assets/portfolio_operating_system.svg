<svg width="1600" height="600" viewBox="0 0 1600 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sherif portfolio operating system</title>
  <desc id="desc">A portfolio map connecting identity, evidence, flagship project, and practice system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="600"><stop stop-color="#070B18"/><stop offset="1" stop-color="#0B182A"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 300) scale(680 320)"><stop stop-color="#2FE8FF" stop-opacity="0.22"/><stop offset="1" stop-color="#08101C" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1600" height="600" rx="38" fill="url(#bg)"/>
  <rect width="1600" height="600" rx="38" fill="url(#glow)"/>
  <rect x="34" y="34" width="1532" height="532" rx="28" stroke="#8EDFFF" stroke-opacity="0.18"/>
  <text x="80" y="98" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="850">Portfolio Operating System</text>
  <text x="80" y="134" fill="#9FB4D8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">A single professional story: identity, proof, project, practice, and review-ready execution.</text>

  <g stroke="#7DE6FF" stroke-opacity="0.26" stroke-width="3">
    <path d="M372 302H566"/>
    <path d="M720 302H914"/>
    <path d="M1068 302H1262"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="206" width="288" height="192" rx="28" fill="#0D1528" stroke="#62E6FF" stroke-opacity="0.34"/>
    <circle cx="130" cy="254" r="20" fill="#122E4D" stroke="#62E6FF"/>
    <text x="164" y="263" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">Identity</text>
    <text x="120" y="314" fill="#DAE5FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Python SDET</text>
    <text x="120" y="342" fill="#DAE5FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">AI Evaluation</text>
    <text x="120" y="370" fill="#8FA5CC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">quality signal, not generic coding</text>

    <rect x="566" y="206" width="288" height="192" rx="28" fill="#0C1327" stroke="#B99DFF" stroke-opacity="0.33"/>
    <circle cx="612" cy="254" r="20" fill="#25194B" stroke="#B99DFF"/>
    <text x="646" y="263" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">Evidence</text>
    <text x="602" y="314" fill="#E7DEFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">reproduce → inspect</text>
    <text x="602" y="342" fill="#E7DEFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">test → explain</text>
    <text x="602" y="370" fill="#9FAED0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">proof before confidence</text>

    <rect x="1048" y="206" width="288" height="192" rx="28" fill="#0D1628" stroke="#FFB84D" stroke-opacity="0.38"/>
    <circle cx="1094" cy="254" r="20" fill="#3A270F" stroke="#FFB84D"/>
    <text x="1128" y="263" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">Flagship</text>
    <text x="1084" y="314" fill="#FFF0D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">DevS69 SDETKit</text>
    <text x="1084" y="342" fill="#FFF0D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">CI reliability platform</text>
    <text x="1084" y="370" fill="#A9B5CE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">local-first, review-first, evidence-first</text>
  </g>

  <g transform="translate(360 455)">
    <rect width="880" height="64" rx="32" fill="#07101E" stroke="#8EDFFF" stroke-opacity="0.17"/>
    <text x="42" y="41" fill="#CFE9FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Coding benchmark practice feeds implementation judgment</text>
    <text x="448" y="41" fill="#FFB84D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Python · Pandas · TypeScript</text>
  </g>
</svg>
