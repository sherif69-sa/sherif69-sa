<svg width="1280" height="300" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="300" rx="26" fill="#0D1726"/>
  <text x="48" y="46" fill="#F2F7FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800">Portfolio Operating System</text>
