<svg width="1280" height="260" viewBox="0 0 1280 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sherif identity card</title>
  <desc id="desc">A professional identity card summarizing Sherif Atef's engineering signal.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="260" rx="24" fill="url(#bg)"/>
  <rect x="34" y="34" width="1212" height="192" rx="22" fill="#020617" fill-opacity="0.58" stroke="#334155"/>
  <text x="72" y="86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3" fill="#38bdf8">PROFILE IDENTITY</text>
  <text x="72" y="138" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="850" fill="#f8fafc">Sherif builds quality systems, not only code.</text>
  <text x="74" y="180" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1">Evidence-first validation • AI output review • failure reproduction • CI-aware engineering</text>
  <g transform="translate(830 62)">
    <rect x="0" y="0" width="350" height="128" rx="18" fill="#0b1220" stroke="#475569"/>
    <text x="24" y="38" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#f59e0b">WHAT I WANT A REVIEWER TO SEE</text>
    <text x="24" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">Reliable debugging discipline</text>
    <text x="24" y="102" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#94a3b8">clear evidence, narrow fixes, proof before claims</text>
  </g>
</svg>
