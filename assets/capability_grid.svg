<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-label="Professional capability grid">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <style>
      .font { font-family: "Segoe UI", Inter, Arial, sans-serif; }
      .head { fill:#f8fafc; font-size:30px; font-weight:800; }
      .label { fill:#e2e8f0; font-size:20px; font-weight:750; }
      .body { fill:#94a3b8; font-size:15px; font-weight:500; }
      .tag { fill:#cbd5e1; font-size:13px; font-weight:650; }
    </style>
  </defs>

  <rect width="1280" height="430" rx="26" fill="url(#panel)" stroke="#1f3b57"/>
  <rect x="44" y="44" width="1192" height="4" rx="2" fill="url(#line)"/>
  <text x="44" y="92" class="font head">Professional signal map</text>
  <text x="44" y="123" class="font body" style="font-size:17px">What the profile is designed to communicate quickly to a recruiter or engineering reviewer.</text>

  <g transform="translate(44,158)">
    <rect x="0" y="0" width="365" height="100" rx="18" fill="#0f1b2d" stroke="#243b53"/>
    <text x="24" y="36" class="font label">Python SDET</text>
    <text x="24" y="64" class="font body">pytest validation · failure reproduction</text>
    <text x="24" y="86" class="font body">test/fix review · clear proof</text>
  </g>

  <g transform="translate(457,158)">
    <rect x="0" y="0" width="365" height="100" rx="18" fill="#0f1b2d" stroke="#243b53"/>
    <text x="24" y="36" class="font label">AI Evaluation</text>
    <text x="24" y="64" class="font body">model-output review · task logic</text>
    <text x="24" y="86" class="font body">rubric alignment · source-grounded QA</text>
  </g>

  <g transform="translate(870,158)">
    <rect x="0" y="0" width="365" height="100" rx="18" fill="#0f1b2d" stroke="#243b53"/>
    <text x="24" y="36" class="font label">Coding Benchmark QA</text>
    <text x="24" y="64" class="font body">edge cases · expected behavior</text>
    <text x="24" y="86" class="font body">reproducibility and reference checks</text>
  </g>

  <g transform="translate(250,288)">
    <rect x="0" y="0" width="365" height="86" rx="18" fill="#0f1b2d" stroke="#243b53"/>
    <text x="24" y="34" class="font label">CI Evidence</text>
    <text x="24" y="62" class="font body">GitHub Actions · command proof · artifacts</text>
  </g>

  <g transform="translate(665,288)">
    <rect x="0" y="0" width="365" height="86" rx="18" fill="#0f1b2d" stroke="#243b53"/>
    <text x="24" y="34" class="font label">Repository Review</text>
    <text x="24" y="62" class="font body">clone · inspect · compare states · validate</text>
  </g>
</svg>
