<svg width="1280" height="460" viewBox="0 0 1280 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Professional capability grid</title>
  <desc id="desc">Capability map for Python SDET, AI evaluation, coding benchmark QA, CI evidence, and repository review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#07101D"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <style>
      .h{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:32px;font-weight:850;fill:#F8FAFC;letter-spacing:-.02em}
      .p{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;font-weight:530;fill:#CBD5E1}
      .k{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:850;fill:#93C5FD;letter-spacing:.1em;text-transform:uppercase}
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:850;fill:#F8FAFC}
      .s{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:550;fill:#94A3B8}
    </style>
  </defs>
  <rect width="1280" height="460" rx="24" fill="url(#bg)"/>
  <rect x="54" y="44" width="1172" height="372" rx="24" fill="#020617" opacity="0.54" stroke="#1E293B"/>
  <text x="88" y="94" class="k">Professional signal</text>
  <text x="88" y="136" class="h">The value is not only writing code. It is proving behavior.</text>
  <text x="88" y="170" class="p">I connect implementation, tests, expected behavior, CI output, and reviewable evidence.</text>
  <g transform="translate(88 220)">
    <g>
      <rect x="0" y="0" width="214" height="130" rx="18" fill="#0F172A" stroke="#2563EB"/>
      <rect x="22" y="22" width="40" height="8" rx="4" fill="#38BDF8"/>
      <text x="22" y="58" class="t">Python SDET</text>
      <text x="22" y="90" class="s">pytest validation</text>
      <text x="22" y="112" class="s">failure reproduction</text>
    </g>
    <g transform="translate(234 0)">
      <rect x="0" y="0" width="214" height="130" rx="18" fill="#0F172A" stroke="#7C3AED"/>
      <rect x="22" y="22" width="40" height="8" rx="4" fill="#A78BFA"/>
      <text x="22" y="58" class="t">AI Evaluation</text>
      <text x="22" y="90" class="s">rubric alignment</text>
      <text x="22" y="112" class="s">source-grounded QA</text>
    </g>
    <g transform="translate(468 0)">
      <rect x="0" y="0" width="214" height="130" rx="18" fill="#0F172A" stroke="#F59E0B"/>
      <rect x="22" y="22" width="40" height="8" rx="4" fill="#FBBF24"/>
      <text x="22" y="58" class="t">Benchmark QA</text>
      <text x="22" y="90" class="s">hidden edge cases</text>
      <text x="22" y="112" class="s">expected behavior</text>
    </g>
    <g transform="translate(702 0)">
      <rect x="0" y="0" width="214" height="130" rx="18" fill="#0F172A" stroke="#22C55E"/>
      <rect x="22" y="22" width="40" height="8" rx="4" fill="#4ADE80"/>
      <text x="22" y="58" class="t">CI Evidence</text>
      <text x="22" y="90" class="s">command proof</text>
      <text x="22" y="112" class="s">JSON / Markdown</text>
    </g>
    <g transform="translate(936 0)">
      <rect x="0" y="0" width="214" height="130" rx="18" fill="#0F172A" stroke="#64748B"/>
      <rect x="22" y="22" width="40" height="8" rx="4" fill="#CBD5E1"/>
      <text x="22" y="58" class="t">Repo Review</text>
      <text x="22" y="90" class="s">clone and inspect</text>
      <text x="22" y="112" class="s">broken/fixed states</text>
    </g>
  </g>
</svg>
