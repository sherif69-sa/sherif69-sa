<svg width="1400" height="520" viewBox="0 0 1400 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Professional capability grid">
  <rect width="1400" height="520" rx="30" fill="#0B1220"/>
  <text x="70" y="78" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial" font-size="36" font-weight="850">Professional Capability Grid</text>
  <text x="70" y="115" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="18">A practical view of where my engineering practice is strongest.</text>
  <g>
    <rect x="70" y="155" width="390" height="130" rx="24" fill="#111827" stroke="#38BDF8"/>
    <text x="100" y="203" fill="#BAE6FD" font-family="Inter, Segoe UI, Arial" font-size="22" font-weight="800">Python SDET</text>
    <text x="100" y="238" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial" font-size="17">pytest · failure reproduction · test review</text>
    <text x="100" y="264" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="14">Focus: real behavior, not only implementation appearance.</text>
    <rect x="505" y="155" width="390" height="130" rx="24" fill="#111827" stroke="#A78BFA"/>
    <text x="535" y="203" fill="#DDD6FE" font-family="Inter, Segoe UI, Arial" font-size="22" font-weight="800">AI Evaluation</text>
    <text x="535" y="238" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial" font-size="17">model output · task logic · rubric fit</text>
    <text x="535" y="264" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="14">Focus: whether generated code actually satisfies the task.</text>
    <rect x="940" y="155" width="390" height="130" rx="24" fill="#111827" stroke="#F59E0B"/>
    <text x="970" y="203" fill="#FDE68A" font-family="Inter, Segoe UI, Arial" font-size="22" font-weight="800">Coding Benchmark QA</text>
    <text x="970" y="238" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial" font-size="17">edge cases · hidden tests · expected behavior</text>
    <text x="970" y="264" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="14">Focus: robust solutions under constraints.</text>
    <rect x="70" y="315" width="390" height="130" rx="24" fill="#111827" stroke="#22C55E"/>
    <text x="100" y="363" fill="#BBF7D0" font-family="Inter, Segoe UI, Arial" font-size="22" font-weight="800">CI Evidence</text>
    <text x="100" y="398" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial" font-size="17">GitHub Actions · command proof · reports</text>
    <text x="100" y="424" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="14">Focus: proof that can be reviewed later.</text>
    <rect x="505" y="315" width="390" height="130" rx="24" fill="#111827" stroke="#38BDF8"/>
    <text x="535" y="363" fill="#BAE6FD" font-family="Inter, Segoe UI, Arial" font-size="22" font-weight="800">Repository Review</text>
    <text x="535" y="398" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial" font-size="17">clone · inspect · compare · validate</text>
    <text x="535" y="424" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="14">Focus: understanding a repo before judging it.</text>
    <rect x="940" y="315" width="390" height="130" rx="24" fill="#111827" stroke="#A78BFA"/>
    <text x="970" y="363" fill="#DDD6FE" font-family="Inter, Segoe UI, Arial" font-size="22" font-weight="800">Quality Communication</text>
    <text x="970" y="398" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial" font-size="17">root cause · scope · next proof</text>
    <text x="970" y="424" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="14">Focus: making technical decisions readable.</text>
