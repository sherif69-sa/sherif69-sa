  <text x="82" y="92" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="900" letter-spacing="3">IDENTITY</text>
  <text x="82" y="142" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="900">I validate software behavior, not just code output.</text>
  <text x="82" y="184" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">The profile is built around proof: clone, reproduce, inspect, test, compare, and report.</text>
