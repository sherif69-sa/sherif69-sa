    <rect x="182" width="174" height="42" rx="21" fill="#172033" stroke="#22D3EE" stroke-opacity=".45"/><text x="207" y="27" fill="#CFFAFE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800">AI Evaluation</text>
