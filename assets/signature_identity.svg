    <rect x="610" width="152" height="42" rx="21" fill="#172033" stroke="#38BDF8" stroke-opacity=".45"/><text x="635" y="27" fill="#E0F2FE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800">CI Evidence</text>
