  <g transform="translate(92 88)">
    <text x="0" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="4" fill="#38bdf8">SIGNATURE PORTFOLIO</text>
    <text x="0" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-2.3" fill="#f8fafc">Sherif Atef</text>
    <text x="2" y="116" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#dbeafe">Python SDET • AI Evaluation Engineer • Coding Benchmark QA</text>
    <text x="2" y="158" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">Evidence-first validation for code behavior, CI signals, model outputs, and reviewable engineering workflows.</text>
    <g transform="translate(0 197)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">
      <rect x="0" y="0" width="114" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4"/><text x="20" y="22" fill="#dbeafe">PYTEST</text>
      <rect x="126" y="0" width="118" height="34" rx="17" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.4"/><text x="148" y="22" fill="#dcfce7">DOCKER</text>
      <rect x="256" y="0" width="96" height="34" rx="17" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.45"/><text x="281" y="22" fill="#ffedd5">CI</text>
      <rect x="364" y="0" width="160" height="34" rx="17" fill="#0f172a" stroke="#a78bfa" stroke-opacity="0.42"/><text x="387" y="22" fill="#ede9fe">AI REVIEW</text>
    </g>
  </g>
  <g transform="translate(830 94)">
    <rect x="0" y="0" width="330" height="220" rx="24" fill="#020617" fill-opacity="0.72" stroke="#334155"/>
    <text x="28" y="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="850" fill="#f8fafc">Operating promise</text>
    <text x="28" y="78" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#94a3b8">I do not stop at “it passes”.</text>
    <text x="28" y="108" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#94a3b8">I check the contract, evidence,</text>
    <text x="28" y="138" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#94a3b8">failure signal, risk, and proof.</text>
    <g transform="translate(28 166)"><rect x="0" y="0" width="274" height="32" rx="16" fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.3"/><text x="18" y="21" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#dbeafe">Clone → Reproduce → Inspect → Prove</text></g>
  </g>
