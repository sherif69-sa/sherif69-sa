    <g transform="translate(27 58)">
      <rect x="0" y="0" width="78" height="34" rx="9" fill="#172033" stroke="#334155"/><text x="17" y="22" class="chip">Clone</text>
      <path d="M86 17H106" stroke="#64748B" stroke-width="2"/>
      <rect x="114" y="0" width="92" height="34" rx="9" fill="#0F766E" opacity="0.86"/><text x="134" y="22" class="chip">Inspect</text>
      <path d="M214 17H234" stroke="#64748B" stroke-width="2"/>
      <rect x="242" y="0" width="92" height="34" rx="9" fill="#2563EB" opacity="0.86"/><text x="269" y="22" class="chip">Prove</text>
