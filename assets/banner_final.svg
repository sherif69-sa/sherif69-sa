<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sherif Atef — Python SDET and AI Evaluation Engineer</title>
  <desc id="desc">Professional GitHub profile banner for Python SDET, AI evaluation, coding benchmark QA, and DevS69 SDETKit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="76" y1="50" x2="1136" y2="314" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.45" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:16px;font-weight:700;letter-spacing:.12em;fill:#93C5FD;text-transform:uppercase}
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:56px;font-weight:800;fill:#F8FAFC;letter-spacing:-.03em}
      .subtitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:650;fill:#CBD5E1}
      .body{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;font-weight:520;fill:#94A3B8}
      .chip{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;font-weight:700;fill:#E2E8F0}
      .mini{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:700;fill:#94A3B8;letter-spacing:.08em}
    </style>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <path d="M0 304C204 244 305 333 468 275C681 199 764 40 1280 88V360H0V304Z" fill="#0EA5E9" opacity="0.08"/>
  <path d="M74 70H1206" stroke="url(#accent)" stroke-width="2" opacity="0.9"/>
  <g filter="url(#shadow)">
    <rect x="74" y="92" width="1132" height="202" rx="24" fill="#0F172A" opacity="0.82" stroke="#334155"/>
  </g>
  <text x="110" y="138" class="label">Evidence-first software validation</text>
  <text x="110" y="202" class="title">Sherif Atef</text>
  <text x="110" y="242" class="subtitle">Python SDET · AI Evaluation Engineer · Coding Benchmark QA</text>
  <text x="110" y="274" class="body">DevS69 SDETKit · CI evidence · pytest validation · repository review · LeetCode discipline</text>

  <g transform="translate(770 126)">
    <rect x="0" y="0" width="376" height="132" rx="20" fill="#020617" opacity="0.76" stroke="#1E293B"/>
    <text x="28" y="36" class="mini">OPERATING LOOP</text>
    <g transform="translate(28 58)">
      <rect x="0" y="0" width="72" height="36" rx="10" fill="#1E293B" stroke="#334155"/><text x="17" y="23" class="chip">Clone</text>
      <path d="M80 18H104" stroke="#64748B" stroke-width="2"/>
      <rect x="112" y="0" width="96" height="36" rx="10" fill="#0F766E" opacity="0.82"/><text x="131" y="23" class="chip">Inspect</text>
      <path d="M216 18H240" stroke="#64748B" stroke-width="2"/>
      <rect x="248" y="0" width="86" height="36" rx="10" fill="#2563EB" opacity="0.84"/><text x="272" y="23" class="chip">Prove</text>
    </g>
    <text x="28" y="118" class="body">review-first · deterministic proof · low-risk boundaries</text>
