    <g transform="translate(27 108)">
      <rect x="0" y="0" width="96" height="24" rx="7" fill="#111827" stroke="#334155"/><text x="14" y="17" class="chip">review-first</text>
      <rect x="112" y="0" width="100" height="24" rx="7" fill="#111827" stroke="#334155"/><text x="127" y="17" class="chip">CI evidence</text>
      <rect x="228" y="0" width="106" height="24" rx="7" fill="#111827" stroke="#334155"/><text x="244" y="17" class="chip">safe scope</text>
