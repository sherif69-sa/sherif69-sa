<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Sherif Atef - Python SDET and AI Evaluation Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="48%" stop-color="#0f1f35"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="52%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <style>
      .font { font-family: "Segoe UI", Inter, Arial, sans-serif; }
      .title { fill: #f8fafc; font-size: 58px; font-weight: 800; letter-spacing: -1.2px; }
      .role { fill: #dbeafe; font-size: 28px; font-weight: 650; }
      .sub { fill: #94a3b8; font-size: 19px; font-weight: 500; }
      .chip { fill: #dbeafe; font-size: 16px; font-weight: 700; }
      .small { fill: #cbd5e1; font-size: 15px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1280" height="360" rx="34" fill="url(#bg)"/>

  <circle cx="1110" cy="66" r="148" fill="#38bdf8" opacity="0.08"/>
  <circle cx="1195" cy="250" r="190" fill="#f59e0b" opacity="0.07"/>
  <circle cx="95" cy="290" r="170" fill="#60a5fa" opacity="0.08"/>

  <rect x="58" y="54" width="1164" height="252" rx="28" fill="#0b1220" opacity="0.58" stroke="#1e3a5f" stroke-width="1.2" filter="url(#softShadow)"/>
  <rect x="58" y="54" width="8" height="252" rx="4" fill="url(#accent)"/>

  <text x="92" y="125" class="font title">Sherif Atef</text>
  <text x="94" y="168" class="font role">Python SDET &amp; AI Evaluation Engineer</text>
  <text x="94" y="204" class="font sub">Coding Benchmark QA · CI Evidence · Test Reliability · Repository Review</text>

  <g transform="translate(94,238)">
    <rect x="0" y="0" width="142" height="36" rx="18" fill="#10243f" stroke="#2563eb" stroke-opacity="0.45"/>
    <text x="22" y="24" class="font chip">Python</text>

    <rect x="158" y="0" width="122" height="36" rx="18" fill="#10243f" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="180" y="24" class="font chip">pytest</text>

    <rect x="296" y="0" width="136" height="36" rx="18" fill="#10243f" stroke="#22c55e" stroke-opacity="0.42"/>
    <text x="319" y="24" class="font chip">Docker</text>

    <rect x="448" y="0" width="190" height="36" rx="18" fill="#10243f" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="470" y="24" class="font chip">GitHub Actions</text>

    <rect x="654" y="0" width="142" height="36" rx="18" fill="#10243f" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="678" y="24" class="font chip">Pandas</text>
  </g>

  <g transform="translate(850,90)">
    <rect x="0" y="0" width="302" height="144" rx="24" fill="#111827" opacity="0.74" stroke="#334155"/>
    <text x="26" y="42" class="font small">Evidence-first engineering loop</text>
    <rect x="26" y="64" width="250" height="14" rx="7" fill="#1f2937"/>
    <rect x="26" y="64" width="198" height="14" rx="7" fill="url(#accent)"/>
    <text x="26" y="108" class="font sub" style="font-size:17px">Reproduce → Validate → Report</text>
  </g>
</svg>
