<svg width="1280" height="430" viewBox="0 0 1280 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sherif Atef — Python SDET and AI Evaluation Engineer</title>
  <desc id="desc">Signature GitHub profile banner for Sherif Atef focused on Python SDET, AI Evaluation, Coding Benchmark QA, DevS69 SDETKit, and evidence-first engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"/><stop offset="0.45" stop-color="#0b1b33"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <radialGradient id="glowA" cx="16%" cy="12%" r="78%"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.34"/><stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.08"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="86%" cy="76%" r="78%"><stop offset="0" stop-color="#f59e0b" stop-opacity="0.27"/><stop offset="0.55" stop-color="#f59e0b" stop-opacity="0.07"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/></filter>
