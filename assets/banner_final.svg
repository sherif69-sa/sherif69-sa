<svg width="1280" height="380" viewBox="0 0 1280 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sherif Atef — Python SDET and AI Evaluation Engineer</title>
  <desc id="desc">Premium executive GitHub profile banner focused on evidence-first software validation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060B14"/>
      <stop offset="0.48" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="72" x2="1200" y2="308" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <style>
      .eyebrow{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;font-weight:800;letter-spacing:.15em;fill:#93C5FD;text-transform:uppercase}
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:58px;font-weight:850;fill:#F8FAFC;letter-spacing:-.035em}
      .role{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:25px;font-weight:700;fill:#DDE7F3;letter-spacing:-.01em}
      .body{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:16px;font-weight:540;fill:#AAB7C8}
      .chip{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:800;fill:#E2E8F0;letter-spacing:.02em}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12px;font-weight:800;fill:#94A3B8;letter-spacing:.08em;text-transform:uppercase}
    </style>
  </defs>
  <rect width="1280" height="380" rx="30" fill="url(#bg)"/>
  <path d="M0 302C183 250 310 323 478 263C664 197 779 54 1280 86V380H0V302Z" fill="#38BDF8" opacity="0.07"/>
  <path d="M74 70H1206" stroke="url(#accent)" stroke-width="2.5" opacity="0.95"/>
  <g filter="url(#shadow)">
    <rect x="74" y="94" width="1132" height="216" rx="26" fill="#0B1120" opacity="0.87" stroke="#293548"/>
  </g>
  <text x="112" y="142" class="eyebrow">Evidence-first software validation</text>
  <text x="112" y="207" class="title">Sherif Atef</text>
  <text x="112" y="250" class="role">Python SDET · AI Evaluation Engineer · Coding Benchmark QA</text>
  <text x="112" y="282" class="body">I reproduce behavior, inspect implementations, test contracts, and report proof that another engineer can review.</text>

