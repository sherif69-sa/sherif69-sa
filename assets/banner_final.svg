<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Sherif Atef — Python SDET and AI Evaluation Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.52" stop-color="#101f39"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="300" fill="url(#bg)"/>
  <circle cx="1120" cy="70" r="150" fill="#2563eb" opacity="0.18" filter="url(#soft)"/>
  <circle cx="120" cy="250" r="170" fill="#7c3aed" opacity="0.14" filter="url(#soft)"/>
  <rect x="72" y="54" width="1136" height="192" rx="30" fill="#020617" opacity="0.42" stroke="#334155"/>
  <rect x="72" y="54" width="8" height="192" rx="4" fill="url(#accent)"/>
  <text x="112" y="114" fill="#e5eefb" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="800">Sherif Atef</text>
  <text x="112" y="162" fill="#93c5fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Python SDET · AI Evaluation Engineer · Coding Benchmark QA</text>
  <text x="112" y="207" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Repository review · pytest validation · CI evidence · failure reproduction · structured proof</text>
  <g transform="translate(820 92)">
    <rect x="0" y="0" width="320" height="112" rx="22" fill="#0f172a" stroke="#334155"/>
    <text x="28" y="42" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Operating loop</text>
    <text x="28" y="76" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Clone → Reproduce → Inspect</text>
    <text x="28" y="100" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Test → Report</text>
  </g>
</svg>
