<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="210" viewBox="0 0 1280 210" role="img" aria-label="Validation workflow: task contract, reproduce, inspect, test, report evidence">
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="210" rx="26" fill="#0b1220"/>
  <text x="54" y="48" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">Validation workflow</text>
  <text x="54" y="78" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">A practical review loop for SDET work, AI evaluation, and benchmark QA.</text>
  <rect x="54" y="116" width="1168" height="7" rx="4" fill="url(#bar)" opacity="0.8"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(70 96)"><circle r="18" fill="#38bdf8"/><text x="-5" y="6" fill="#06111f" font-size="16" font-weight="800">1</text><text x="-16" y="62" fill="#e2e8f0" font-size="17" font-weight="700">Contract</text><text x="-34" y="88" fill="#94a3b8" font-size="13">expected behavior</text></g>
    <g transform="translate(315 96)"><circle r="18" fill="#60a5fa"/><text x="-5" y="6" fill="#06111f" font-size="16" font-weight="800">2</text><text x="-26" y="62" fill="#e2e8f0" font-size="17" font-weight="700">Reproduce</text><text x="-38" y="88" fill="#94a3b8" font-size="13">confirm the signal</text></g>
    <g transform="translate(560 96)"><circle r="18" fill="#818cf8"/><text x="-5" y="6" fill="#06111f" font-size="16" font-weight="800">3</text><text x="-18" y="62" fill="#e2e8f0" font-size="17" font-weight="700">Inspect</text><text x="-42" y="88" fill="#94a3b8" font-size="13">code, tests, data</text></g>
    <g transform="translate(805 96)"><circle r="18" fill="#a78bfa"/><text x="-5" y="6" fill="#06111f" font-size="16" font-weight="800">4</text><text x="-13" y="62" fill="#e2e8f0" font-size="17" font-weight="700">Test</text><text x="-34" y="88" fill="#94a3b8" font-size="13">focused proof</text></g>
    <g transform="translate(1050 96)"><circle r="18" fill="#c084fc"/><text x="-5" y="6" fill="#06111f" font-size="16" font-weight="800">5</text><text x="-20" y="62" fill="#e2e8f0" font-size="17" font-weight="700">Report</text><text x="-42" y="88" fill="#94a3b8" font-size="13">reviewable evidence</text></g>
  </g>
</svg>
