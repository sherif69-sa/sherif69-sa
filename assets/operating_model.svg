<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Working method from task contract to evidence</title>
  <desc id="desc">A working method visual: understand contract, reproduce behavior, inspect implementation, run validation, compare expected versus actual, document evidence.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <text x="56" y="66" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="900" fill="#f8fafc">Working Method</text>
  <text x="56" y="100" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#94a3b8">The same loop I use for SDET work, AI evaluation, coding benchmark review, and CI evidence.</text>
  <g transform="translate(70 162)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g><rect width="164" height="92" rx="18" fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.46"/><text x="24" y="38" font-size="16" font-weight="850" fill="#f8fafc">01 Contract</text><text x="24" y="66" font-size="13" fill="#cbd5e1">what must be true?</text></g>
    <g transform="translate(188 0)"><rect width="164" height="92" rx="18" fill="#0b1220" stroke="#38bdf8" stroke-opacity="0.46"/><text x="24" y="38" font-size="16" font-weight="850" fill="#f8fafc">02 Reproduce</text><text x="24" y="66" font-size="13" fill="#cbd5e1">observe behavior</text></g>
    <g transform="translate(376 0)"><rect width="164" height="92" rx="18" fill="#0b1220" stroke="#22c55e" stroke-opacity="0.46"/><text x="24" y="38" font-size="16" font-weight="850" fill="#f8fafc">03 Inspect</text><text x="24" y="66" font-size="13" fill="#cbd5e1">source and tests</text></g>
    <g transform="translate(564 0)"><rect width="164" height="92" rx="18" fill="#0b1220" stroke="#22c55e" stroke-opacity="0.46"/><text x="24" y="38" font-size="16" font-weight="850" fill="#f8fafc">04 Validate</text><text x="24" y="66" font-size="13" fill="#cbd5e1">focused proof</text></g>
    <g transform="translate(752 0)"><rect width="164" height="92" rx="18" fill="#0b1220" stroke="#f59e0b" stroke-opacity="0.46"/><text x="24" y="38" font-size="16" font-weight="850" fill="#f8fafc">05 Compare</text><text x="24" y="66" font-size="13" fill="#cbd5e1">expected vs actual</text></g>
    <g transform="translate(940 0)"><rect width="164" height="92" rx="18" fill="#0b1220" stroke="#f59e0b" stroke-opacity="0.46"/><text x="24" y="38" font-size="16" font-weight="850" fill="#f8fafc">06 Evidence</text><text x="24" y="66" font-size="13" fill="#cbd5e1">report clearly</text></g>
  </g>
</svg>
