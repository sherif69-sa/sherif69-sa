      <rect x="0" y="0" width="165" height="80" rx="18" fill="#0b1220" stroke="#22c55e"/><text x="26" y="34" font-size="14" font-weight="850" fill="#22c55e">03</text><text x="60" y="34" font-size="15" font-weight="800" fill="#f8fafc">Inspect</text><text x="26" y="58" font-size="12" fill="#94a3b8">read code and tests</text>
    </g>
