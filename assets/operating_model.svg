<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Working method from task contract to documented evidence">
  <rect width="1200" height="300" rx="26" fill="#F8FAFC"/>
  <text x="60" y="58" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="850">Evidence-first working method</text>
  <text x="60" y="90" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">A repeatable path for SDET work, AI evaluation, benchmark review, and repository-quality validation.</text>

  <g>
    <rect x="60" y="140" width="160" height="74" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="90" y="173" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">01 Contract</text>
    <text x="90" y="196" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">understand task</text>
    <path d="M228 177H278" stroke="#94A3B8" stroke-width="2"/>

    <rect x="286" y="140" width="160" height="74" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="316" y="173" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">02 Reproduce</text>
    <text x="316" y="196" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">observe behavior</text>
    <path d="M454 177H504" stroke="#94A3B8" stroke-width="2"/>

    <rect x="512" y="140" width="160" height="74" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="542" y="173" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">03 Inspect</text>
    <text x="542" y="196" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">find owner surface</text>
    <path d="M680 177H730" stroke="#94A3B8" stroke-width="2"/>

    <rect x="738" y="140" width="160" height="74" rx="18" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="768" y="173" fill="#0F172A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">04 Validate</text>
    <text x="768" y="196" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">focused proof</text>
    <path d="M906 177H956" stroke="#94A3B8" stroke-width="2"/>

    <rect x="964" y="140" width="176" height="74" rx="18" fill="#0F172A"/>
    <text x="994" y="173" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">05 Report</text>
    <text x="994" y="196" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">document evidence</text>
  </g>

  <rect x="60" y="240" width="1080" height="34" rx="17" fill="#E2E8F0"/>
  <text x="88" y="262" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="650">Output goal: another engineer can review the task, proof, risk, and next action without guessing.</text>
</svg>
