<svg width="1280" height="500" viewBox="0 0 1280 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode practice matrix</title>
  <desc id="desc">A professional LeetCode practice matrix with Python, Pandas, and TypeScript tracks connected to real engineering habits.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
  <rect width="1280" height="500" rx="24" fill="url(#bg)"/>
  <text x="56" y="68" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="900" fill="#f8fafc">LeetCode Practice Matrix</text>
  <text x="56" y="102" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#94a3b8">A programming discipline system that supports SDET judgment, not a badge wall.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(68 146)"><rect width="336" height="212" rx="24" fill="#020617" stroke="#f59e0b" stroke-opacity="0.52"/><text x="26" y="46" font-size="24" font-weight="900" fill="#f8fafc">Python / Python3</text><text x="26" y="86" font-size="15" fill="#cbd5e1">main algorithm and data-structure track</text><text x="26" y="124" font-size="15" fill="#cbd5e1">graphs • DP • heaps • binary search</text><text x="26" y="154" font-size="15" fill="#cbd5e1">streams • caches • design problems</text></g>
    <g transform="translate(472 146)"><rect width="336" height="212" rx="24" fill="#020617" stroke="#38bdf8" stroke-opacity="0.52"/><text x="26" y="46" font-size="24" font-weight="900" fill="#f8fafc">Pandas</text><text x="26" y="86" font-size="15" fill="#cbd5e1">dataframe and database-style track</text><text x="26" y="124" font-size="15" fill="#cbd5e1">tables • metrics • grouped reports</text><text x="26" y="154" font-size="15" fill="#cbd5e1">logs • evidence artifacts</text></g>
    <g transform="translate(876 146)"><rect width="336" height="212" rx="24" fill="#020617" stroke="#a78bfa" stroke-opacity="0.52"/><text x="26" y="46" font-size="24" font-weight="900" fill="#f8fafc">TypeScript</text><text x="26" y="86" font-size="15" fill="#cbd5e1">support track for JS/TS problems</text><text x="26" y="124" font-size="15" fill="#cbd5e1">typed APIs • closures • classes</text><text x="26" y="154" font-size="15" fill="#cbd5e1">frontend-style design habits</text></g>
    <g transform="translate(148 390)" font-size="14" font-weight="850">
      <rect x="0" y="0" width="170" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.35"/><text x="28" y="22" fill="#dbeafe">Correctness</text>
      <rect x="190" y="0" width="180" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.35"/><text x="218" y="22" fill="#dbeafe">Hidden tests</text>
      <rect x="390" y="0" width="180" height="34" rx="17" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.35"/><text x="421" y="22" fill="#dcfce7">Runtime</text>
      <rect x="590" y="0" width="180" height="34" rx="17" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.35"/><text x="622" y="22" fill="#dcfce7">Memory</text>
      <rect x="790" y="0" width="210" height="34" rx="17" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.38"/><text x="822" y="22" fill="#ffedd5">Debugging discipline</text>
    </g>
  </g>
</svg>
