<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode benchmark practice matrix</title>
  <desc id="desc">Python, Pandas, and TypeScript tracks with engineering transfer habits.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1600" y2="560"><stop stop-color="#080B18"/><stop offset="1" stop-color="#11151E"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity="0.28"/></filter></defs>
  <rect width="1600" height="560" rx="34" fill="url(#bg)"/>
  <rect x="30" y="30" width="1540" height="500" rx="28" stroke="#FFB84D" stroke-opacity="0.18"/>
  <text x="76" y="92" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="850">LeetCode Practice Matrix</text>
  <text x="76" y="126" fill="#AEB7C8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">A programming discipline system for correctness, hidden tests, memory, and practical runtime.</text>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(86 190)"><rect width="410" height="230" rx="26" fill="#111827" stroke="#58DFFF" stroke-opacity="0.30"/><text x="30" y="56" fill="#58DFFF" font-size="20" font-weight="850">PYTHON / PYTHON3</text><text x="30" y="100" fill="#FFF" font-size="28" font-weight="850">main algorithm track</text><text x="30" y="142" fill="#DCE6FB" font-size="18">graphs · DP · heaps · binary search</text><text x="30" y="172" fill="#DCE6FB" font-size="18">streams · caches · design problems</text><text x="30" y="210" fill="#91A6CA" font-size="15">transfer: faster debugging and cleaner implementation</text></g>
    <g transform="translate(595 190)"><rect width="410" height="230" rx="26" fill="#10192A" stroke="#66FFB8" stroke-opacity="0.26"/><text x="30" y="56" fill="#66FFB8" font-size="20" font-weight="850">PANDAS</text><text x="30" y="100" fill="#FFF" font-size="28" font-weight="850">dataframe proof track</text><text x="30" y="142" fill="#DDFDEE" font-size="18">tables · joins · logs · grouping</text><text x="30" y="172" fill="#DDFDEE" font-size="18">reports · metrics · artifact thinking</text><text x="30" y="210" fill="#91A8BE" font-size="15">transfer: structured data validation in QA work</text></g>
    <g transform="translate(1104 190)"><rect width="410" height="230" rx="26" fill="#151320" stroke="#BCA4FF" stroke-opacity="0.26"/><text x="30" y="56" fill="#BCA4FF" font-size="20" font-weight="850">TYPESCRIPT</text><text x="30" y="100" fill="#FFF" font-size="28" font-weight="850">support design track</text><text x="30" y="142" fill="#E4DDFF" font-size="18">typed APIs · closures · classes</text><text x="30" y="172" fill="#E4DDFF" font-size="18">frontend-style design and JS problems</text><text x="30" y="210" fill="#99A8C9" font-size="15">transfer: broader coding benchmark literacy</text></g>
  </g>

  <g transform="translate(206 468)">
    <rect width="1188" height="54" rx="27" fill="#0A111D" stroke="#FFB84D" stroke-opacity="0.18"/>
    <text x="46" y="35" fill="#FFF3DF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Correctness → hidden-test safety → optimal algorithm → memory awareness → practical runtime → micro-optimization</text>
  </g>
</svg>
