<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="LeetCode practice matrix">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .font { font-family: "Segoe UI", Inter, Arial, sans-serif; }
      .title { fill:#f8fafc; font-size:30px; font-weight:800; }
      .label { fill:#f8fafc; font-size:22px; font-weight:850; }
      .body { fill:#94a3b8; font-size:15px; font-weight:550; }
      .pill { fill:#cbd5e1; font-size:13px; font-weight:700; }
    </style>
  </defs>

  <rect width="1280" height="360" rx="26" fill="url(#bg)" stroke="#1f3b57"/>
  <text x="48" y="68" class="font title">LeetCode practice matrix</text>
  <text x="48" y="100" class="font body" style="font-size:17px">A deliberate training system for algorithmic judgment, data handling, implementation speed, and hidden-test safety.</text>

  <g transform="translate(62,140)">
    <rect x="0" y="0" width="345" height="142" rx="22" fill="#0f1b2d" stroke="#2563eb"/>
    <text x="28" y="42" class="font label">Python / Python3</text>
    <text x="28" y="72" class="font body">Main algorithm and data-structure track</text>
    <rect x="28" y="94" width="88" height="26" rx="13" fill="#172554"/>
    <text x="45" y="113" class="font pill">DP</text>
    <rect x="126" y="94" width="98" height="26" rx="13" fill="#172554"/>
    <text x="146" y="113" class="font pill">Graphs</text>
    <rect x="234" y="94" width="82" height="26" rx="13" fill="#172554"/>
    <text x="254" y="113" class="font pill">Heaps</text>
  </g>

  <g transform="translate(467,140)">
    <rect x="0" y="0" width="345" height="142" rx="22" fill="#0f1b2d" stroke="#a78bfa"/>
    <text x="28" y="42" class="font label">Pandas</text>
    <text x="28" y="72" class="font body">DataFrame and database-style track</text>
    <rect x="28" y="94" width="92" height="26" rx="13" fill="#312e81"/>
    <text x="43" y="113" class="font pill">Tables</text>
    <rect x="130" y="94" width="96" height="26" rx="13" fill="#312e81"/>
    <text x="148" y="113" class="font pill">Reports</text>
    <rect x="236" y="94" width="80" height="26" rx="13" fill="#312e81"/>
    <text x="255" y="113" class="font pill">Logs</text>
  </g>

  <g transform="translate(872,140)">
    <rect x="0" y="0" width="345" height="142" rx="22" fill="#0f1b2d" stroke="#f59e0b"/>
    <text x="28" y="42" class="font label">TypeScript</text>
    <text x="28" y="72" class="font body">Support track for typed JS/TS problems</text>
    <rect x="28" y="94" width="96" height="26" rx="13" fill="#451a03"/>
    <text x="46" y="113" class="font pill">Classes</text>
    <rect x="134" y="94" width="104" height="26" rx="13" fill="#451a03"/>
    <text x="152" y="113" class="font pill">Closures</text>
    <rect x="248" y="94" width="70" height="26" rx="13" fill="#451a03"/>
    <text x="265" y="113" class="font pill">APIs</text>
  </g>

  <text x="62" y="326" class="font body">Priority order: correctness → hidden-test safety → optimal algorithm → memory awareness → practical runtime → micro-optimization.</text>
</svg>
