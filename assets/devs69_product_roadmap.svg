<svg width="1280" height="520" viewBox="0 0 1280 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DevS69 SDETKit product roadmap</title>
  <desc id="desc">A roadmap for DevS69 SDETKit from evidence core to failure vector engine, safety gate, trajectory store, benchmark harness, protected verifier, and PR reporter.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.48" stop-color="#22c55e"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs>
  <rect width="1280" height="520" rx="24" fill="url(#bg)"/>
  <text x="56" y="66" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="900" fill="#f8fafc">DevS69 SDETKit Product Roadmap</text>
  <text x="56" y="100" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#94a3b8">A local-first reliability platform for exact failure diagnosis, safe review boundaries, proof, and memory.</text>
  <rect x="80" y="230" width="1120" height="8" rx="4" fill="url(#line)" opacity="0.92"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(48 146)"><circle cx="70" cy="88" r="18" fill="#38bdf8"/><rect x="0" y="120" width="164" height="124" rx="18" fill="#0b1220" stroke="#1e3a8a"/><text x="18" y="154" font-size="15" font-weight="850" fill="#f8fafc">Evidence Core</text><text x="18" y="184" font-size="13" fill="#cbd5e1">logs, commands,</text><text x="18" y="206" font-size="13" fill="#cbd5e1">CI artifacts</text></g>
    <g transform="translate(222 146)"><circle cx="76" cy="88" r="18" fill="#38bdf8"/><rect x="0" y="120" width="176" height="124" rx="18" fill="#0b1220" stroke="#0369a1"/><text x="16" y="154" font-size="15" font-weight="850" fill="#f8fafc">FailureVector</text><text x="16" y="184" font-size="13" fill="#cbd5e1">first failure,</text><text x="16" y="206" font-size="13" fill="#cbd5e1">classification</text></g>
    <g transform="translate(412 146)"><circle cx="70" cy="88" r="18" fill="#22c55e"/><rect x="0" y="120" width="164" height="124" rx="18" fill="#0b1220" stroke="#166534"/><text x="18" y="154" font-size="15" font-weight="850" fill="#f8fafc">SafetyGate</text><text x="18" y="184" font-size="13" fill="#cbd5e1">review-first</text><text x="18" y="206" font-size="13" fill="#cbd5e1">risk boundary</text></g>
    <g transform="translate(590 146)"><circle cx="76" cy="88" r="18" fill="#22c55e"/><rect x="0" y="120" width="176" height="124" rx="18" fill="#0b1220" stroke="#15803d"/><text x="16" y="154" font-size="15" font-weight="850" fill="#f8fafc">TrajectoryStore</text><text x="16" y="184" font-size="13" fill="#cbd5e1">action → response</text><text x="16" y="206" font-size="13" fill="#cbd5e1">proof → outcome</text></g>
    <g transform="translate(780 146)"><circle cx="84" cy="88" r="18" fill="#f59e0b"/><rect x="0" y="120" width="194" height="124" rx="18" fill="#0b1220" stroke="#92400e"/><text x="16" y="154" font-size="15" font-weight="850" fill="#f8fafc">BenchmarkHarness</text><text x="16" y="184" font-size="13" fill="#cbd5e1">nop / oracle /</text><text x="16" y="206" font-size="13" fill="#cbd5e1">unsafe scenarios</text></g>
    <g transform="translate(994 146)"><circle cx="84" cy="88" r="18" fill="#f59e0b"/><rect x="0" y="120" width="200" height="124" rx="18" fill="#0b1220" stroke="#b45309"/><text x="16" y="154" font-size="15" font-weight="850" fill="#f8fafc">Verifier + Report</text><text x="16" y="184" font-size="13" fill="#cbd5e1">scope, proof,</text><text x="16" y="206" font-size="13" fill="#cbd5e1">PR evidence</text></g>
  </g>
  <text x="56" y="440" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#dbeafe">Roadmap principle:</text><text x="202" y="440" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#cbd5e1">ambitious in diagnosis, conservative in action, local-first before cloud or automation.</text>
</svg>
