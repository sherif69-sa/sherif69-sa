<svg width="1600" height="680" viewBox="0 0 1600 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DevS69 SDETKit reliability platform roadmap</title>
  <desc id="desc">A local-first roadmap from evidence core to protected verification and reporting.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1600" y2="680"><stop stop-color="#070B18"/><stop offset="1" stop-color="#0D1425"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity="0.30"/></filter></defs>
  <rect width="1600" height="680" rx="34" fill="url(#bg)"/>
  <rect x="30" y="30" width="1540" height="620" rx="28" stroke="#8CDFFF" stroke-opacity="0.15"/>
  <text x="76" y="94" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="850">DevS69 SDETKit Product Roadmap</text>
  <text x="76" y="130" fill="#98AACE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">From raw CI noise to exact diagnosis, safety decision, proof, and reviewable report.</text>
  <path d="M170 356H1430" stroke="#6CE7FF" stroke-opacity="0.21" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(94 204)"><rect width="236" height="270" rx="24" fill="#0D172A" stroke="#5BE2FF" stroke-opacity="0.32"/><text x="26" y="52" fill="#5BE2FF" font-size="18" font-weight="800">WAVE A</text><text x="26" y="96" fill="#FFF" font-size="24" font-weight="850">Evidence Core</text><text x="26" y="138" fill="#DCE6FA" font-size="17">logs</text><text x="26" y="166" fill="#DCE6FA" font-size="17">commands</text><text x="26" y="194" fill="#DCE6FA" font-size="17">artifacts</text><text x="26" y="238" fill="#90A6CB" font-size="14">collect before deciding</text></g>
    <g transform="translate(354 204)"><rect width="236" height="270" rx="24" fill="#101329" stroke="#BCA4FF" stroke-opacity="0.32"/><text x="26" y="52" fill="#BCA4FF" font-size="18" font-weight="800">WAVE B</text><text x="26" y="96" fill="#FFF" font-size="24" font-weight="850">FailureVector</text><text x="26" y="138" fill="#E4DDFF" font-size="17">first failure</text><text x="26" y="166" fill="#E4DDFF" font-size="17">classify risk</text><text x="26" y="194" fill="#E4DDFF" font-size="17">owner surface</text><text x="26" y="238" fill="#9CA9CC" font-size="14">diagnosis over headline</text></g>
    <g transform="translate(614 204)"><rect width="236" height="270" rx="24" fill="#111928" stroke="#FFB84D" stroke-opacity="0.34"/><text x="26" y="52" fill="#FFB84D" font-size="18" font-weight="800">WAVE C</text><text x="26" y="96" fill="#FFF" font-size="24" font-weight="850">SafetyGate</text><text x="26" y="138" fill="#FFF1DB" font-size="17">safe category</text><text x="26" y="166" fill="#FFF1DB" font-size="17">scope check</text><text x="26" y="194" fill="#FFF1DB" font-size="17">review-first</text><text x="26" y="238" fill="#A9B4C8" font-size="14">unknown stays human</text></g>
    <g transform="translate(874 204)"><rect width="236" height="270" rx="24" fill="#0D1821" stroke="#66FFB8" stroke-opacity="0.26"/><text x="26" y="52" fill="#66FFB8" font-size="18" font-weight="800">WAVE D</text><text x="26" y="96" fill="#FFF" font-size="24" font-weight="850">Trajectory</text><text x="26" y="138" fill="#DDFDEE" font-size="17">action</text><text x="26" y="166" fill="#DDFDEE" font-size="17">response</text><text x="26" y="194" fill="#DDFDEE" font-size="17">proof outcome</text><text x="26" y="238" fill="#91A8BE" font-size="14">learn safely over time</text></g>
    <g transform="translate(1134 204)"><rect width="236" height="270" rx="24" fill="#0C1327" stroke="#C8D6FF" stroke-opacity="0.26"/><text x="26" y="52" fill="#C8D6FF" font-size="18" font-weight="800">WAVE E</text><text x="26" y="96" fill="#FFF" font-size="24" font-weight="850">Verifier</text><text x="26" y="138" fill="#E2EAFF" font-size="17">anti-cheat</text><text x="26" y="166" fill="#E2EAFF" font-size="17">fresh proof</text><text x="26" y="194" fill="#E2EAFF" font-size="17">patch scope</text><text x="26" y="238" fill="#96A8CA" font-size="14">green is not enough</text></g>
  </g>
  <g transform="translate(246 548)">
    <rect width="1108" height="56" rx="28" fill="#080F1C" stroke="#8EDFFF" stroke-opacity="0.14"/>
    <text x="42" y="36" fill="#DCEBFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Target: reviewable reliability platform before autonomous repair volume</text>
    <text x="640" y="36" fill="#FFB84D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">local-first · file-backed · verifier-protected</text>
  </g>
</svg>
