<svg width="1280" height="460" viewBox="0 0 1280 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DevS69 SDETKit product roadmap</title>
  <desc id="desc">A clean roadmap from evidence core to failure vector engine, safety gate, trajectory store, benchmark harness, protected verifier, and PR reporter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="0.55" stop-color="#22c55e"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="460" rx="24" fill="url(#bg)"/>
  <text x="56" y="66" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="850" fill="#f8fafc">DevS69 SDETKit Roadmap</text>
  <text x="56" y="100" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#94a3b8">Local-first reliability platform: evidence, diagnosis, safety, proof, memory, and reporting.</text>
  <rect x="74" y="210" width="1128" height="8" rx="4" fill="url(#line)" opacity="0.9"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(58 142)">
      <circle cx="68" cy="72" r="18" fill="#38bdf8"/>
      <rect x="0" y="102" width="160" height="116" rx="18" fill="#0b1220" stroke="#1e3a8a"/>
      <text x="20" y="136" font-size="15" font-weight="850" fill="#f8fafc">Evidence Core</text>
      <text x="20" y="166" font-size="13" fill="#cbd5e1">logs, commands,</text>
      <text x="20" y="188" font-size="13" fill="#cbd5e1">CI metadata</text>
    </g>
    <g transform="translate(235 142)">
      <circle cx="68" cy="72" r="18" fill="#38bdf8"/>
      <rect x="0" y="102" width="170" height="116" rx="18" fill="#0b1220" stroke="#0369a1"/>
      <text x="18" y="136" font-size="15" font-weight="850" fill="#f8fafc">FailureVector</text>
      <text x="18" y="166" font-size="13" fill="#cbd5e1">first failure,</text>
      <text x="18" y="188" font-size="13" fill="#cbd5e1">classification</text>
    </g>
    <g transform="translate(425 142)">
      <circle cx="68" cy="72" r="18" fill="#22c55e"/>
      <rect x="0" y="102" width="160" height="116" rx="18" fill="#0b1220" stroke="#166534"/>
      <text x="20" y="136" font-size="15" font-weight="850" fill="#f8fafc">SafetyGate</text>
      <text x="20" y="166" font-size="13" fill="#cbd5e1">review-first</text>
      <text x="20" y="188" font-size="13" fill="#cbd5e1">boundaries</text>
    </g>
    <g transform="translate(602 142)">
      <circle cx="68" cy="72" r="18" fill="#22c55e"/>
      <rect x="0" y="102" width="178" height="116" rx="18" fill="#0b1220" stroke="#15803d"/>
      <text x="18" y="136" font-size="15" font-weight="850" fill="#f8fafc">TrajectoryStore</text>
      <text x="18" y="166" font-size="13" fill="#cbd5e1">action response</text>
      <text x="18" y="188" font-size="13" fill="#cbd5e1">proof outcome</text>
    </g>
    <g transform="translate(800 142)">
      <circle cx="68" cy="72" r="18" fill="#f59e0b"/>
      <rect x="0" y="102" width="190" height="116" rx="18" fill="#0b1220" stroke="#92400e"/>
      <text x="18" y="136" font-size="15" font-weight="850" fill="#f8fafc">BenchmarkHarness</text>
      <text x="18" y="166" font-size="13" fill="#cbd5e1">nop, oracle,</text>
      <text x="18" y="188" font-size="13" fill="#cbd5e1">unsafe scenarios</text>
    </g>
    <g transform="translate(1010 142)">
      <circle cx="68" cy="72" r="18" fill="#f59e0b"/>
      <rect x="0" y="102" width="190" height="116" rx="18" fill="#0b1220" stroke="#b45309"/>
      <text x="18" y="136" font-size="15" font-weight="850" fill="#f8fafc">Verifier + Reporter</text>
      <text x="18" y="166" font-size="13" fill="#cbd5e1">scope, proof,</text>
      <text x="18" y="188" font-size="13" fill="#cbd5e1">PR evidence</text>
    </g>
  </g>
</svg>
