<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DevS69 SDETKit product roadmap</title>
  <desc id="desc">Roadmap from evidence core to local-first reliability platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#07101D"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="rail" x1="120" y1="295" x2="1160" y2="295"><stop stop-color="#38BDF8"/><stop offset="0.5" stop-color="#22C55E"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <style>
      .k{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:850;fill:#93C5FD;letter-spacing:.11em;text-transform:uppercase}
      .h{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:34px;font-weight:850;fill:#F8FAFC;letter-spacing:-.02em}
      .p{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;font-weight:530;fill:#CBD5E1}
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:850;fill:#F8FAFC}
      .s{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13.5px;font-weight:550;fill:#94A3B8}
      .num{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:900;fill:#020617}
    </style>
  </defs>
  <rect width="1280" height="560" rx="24" fill="url(#bg)"/>
  <text x="70" y="70" class="k">DevS69 SDETKit roadmap</text>
  <text x="70" y="114" class="h">Local-first reliability platform for noisy CI and terminal behavior.</text>
  <text x="70" y="150" class="p">The roadmap starts with deterministic artifacts and proof, then grows toward safe, verifier-protected remediation.</text>
  <rect x="70" y="190" width="1140" height="286" rx="24" fill="#020617" opacity="0.54" stroke="#1E293B"/>
  <path d="M136 321H1144" stroke="url(#rail)" stroke-width="6" stroke-linecap="round"/>

  <g transform="translate(96 240)">
    <rect x="0" y="0" width="174" height="150" rx="18" fill="#0F172A" stroke="#334155"/>
    <circle cx="28" cy="30" r="14" fill="#38BDF8"/><text x="23" y="35" class="num">1</text>
    <text x="22" y="66" class="t">Evidence Core</text>
    <text x="22" y="98" class="s">logs · commands</text>
    <text x="22" y="120" class="s">CI metadata · artifacts</text>
  </g>
  <g transform="translate(286 240)">
    <rect x="0" y="0" width="184" height="150" rx="18" fill="#0F172A" stroke="#334155"/>
    <circle cx="28" cy="30" r="14" fill="#60A5FA"/><text x="23" y="35" class="num">2</text>
    <text x="22" y="66" class="t">FailureVector</text>
    <text x="22" y="98" class="s">first real failure</text>
    <text x="22" y="120" class="s">class · scope · risk</text>
  </g>
  <g transform="translate(486 240)">
    <rect x="0" y="0" width="174" height="150" rx="18" fill="#0F172A" stroke="#334155"/>
    <circle cx="28" cy="30" r="14" fill="#22C55E"/><text x="23" y="35" class="num">3</text>
    <text x="22" y="66" class="t">SafetyGate</text>
    <text x="22" y="98" class="s">review-first unknowns</text>
    <text x="22" y="120" class="s">scope boundaries</text>
  </g>
  <g transform="translate(676 240)">
    <rect x="0" y="0" width="190" height="150" rx="18" fill="#0F172A" stroke="#334155"/>
    <circle cx="28" cy="30" r="14" fill="#A78BFA"/><text x="23" y="35" class="num">4</text>
    <text x="22" y="66" class="t">TrajectoryStore</text>
    <text x="22" y="98" class="s">action → response</text>
    <text x="22" y="120" class="s">diagnosis → proof</text>
  </g>
  <g transform="translate(882 240)">
    <rect x="0" y="0" width="178" height="150" rx="18" fill="#0F172A" stroke="#334155"/>
    <circle cx="28" cy="30" r="14" fill="#FBBF24"/><text x="23" y="35" class="num">5</text>
    <text x="22" y="66" class="t">Benchmark</text>
    <text x="22" y="98" class="s">nop · oracle</text>
    <text x="22" y="120" class="s">unsafe checks</text>
  </g>
  <g transform="translate(1076 240)">
    <rect x="0" y="0" width="104" height="150" rx="18" fill="#0F172A" stroke="#334155"/>
    <circle cx="28" cy="30" r="14" fill="#F59E0B"/><text x="23" y="35" class="num">6</text>
    <text x="22" y="66" class="t">Verify</text>
    <text x="22" y="98" class="s">PR</text>
    <text x="22" y="120" class="s">reports</text>
  </g>

  <rect x="70" y="500" width="1140" height="38" rx="14" fill="#020617" opacity="0.72" stroke="#1E293B"/>
  <text x="98" y="524" class="s">Boundary: unknown, security, dependency, release, and broad refactor failures remain review-first until proof and verifier contracts are mature.</text>
</svg>
