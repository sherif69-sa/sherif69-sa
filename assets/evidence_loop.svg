<svg width="1400" height="300" viewBox="0 0 1400 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Evidence validation loop</title>
  <desc id="desc">Clone, reproduce, inspect, test, and report evidence workflow.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1400" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="120" y1="150" x2="1280" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="300" rx="28" fill="url(#card)"/>
  <text x="54" y="58" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial" font-size="30" font-weight="800">Evidence-first validation loop</text>
  <path d="M160 155H1240" stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity="0.8"/>

  <g font-family="Inter, Segoe UI, Arial" text-anchor="middle">
    <g transform="translate(180 155)">
      <circle r="55" fill="#082F49" stroke="#38BDF8" stroke-width="4"/>
      <text y="-6" fill="#FFFFFF" font-size="21" font-weight="800">Clone</text>
      <text y="24" fill="#BAE6FD" font-size="14">repo state</text>
    </g>
    <g transform="translate(440 155)">
      <circle r="55" fill="#064E3B" stroke="#10B981" stroke-width="4"/>
      <text y="-6" fill="#FFFFFF" font-size="21" font-weight="800">Reproduce</text>
      <text y="24" fill="#BBF7D0" font-size="14">behavior</text>
    </g>
    <g transform="translate(700 155)">
      <circle r="55" fill="#312E81" stroke="#8B5CF6" stroke-width="4"/>
      <text y="-6" fill="#FFFFFF" font-size="21" font-weight="800">Inspect</text>
      <text y="24" fill="#DDD6FE" font-size="14">contract</text>
    </g>
    <g transform="translate(960 155)">
      <circle r="55" fill="#7C2D12" stroke="#FB923C" stroke-width="4"/>
      <text y="-6" fill="#FFFFFF" font-size="21" font-weight="800">Test</text>
      <text y="24" fill="#FED7AA" font-size="14">proof</text>
    </g>
    <g transform="translate(1220 155)">
      <circle r="55" fill="#3B0764" stroke="#E879F9" stroke-width="4"/>
      <text y="-6" fill="#FFFFFF" font-size="21" font-weight="800">Report</text>
      <text y="24" fill="#F5D0FE" font-size="14">evidence</text>
    </g>
  </g>
</svg>
