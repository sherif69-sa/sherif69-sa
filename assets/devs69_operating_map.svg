<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DevS69 SDETKit operating roadmap</title>
  <desc id="desc">Product roadmap from evidence core to reliability platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#08111F"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="line" x1="130" y1="268" x2="1148" y2="268"><stop stop-color="#38BDF8"/><stop offset="0.5" stop-color="#22C55E"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <style>
      .h{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:34px;font-weight:850;fill:#F8FAFC;letter-spacing:-.02em}
      .p{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;font-weight:520;fill:#CBD5E1}
      .k{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:800;fill:#93C5FD;letter-spacing:.1em;text-transform:uppercase}
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:18px;font-weight:800;fill:#F8FAFC}
      .s{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:540;fill:#94A3B8}
      .num{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:850;fill:#020617}
    </style>
  </defs>
  <rect width="1280" height="520" rx="24" fill="url(#bg)"/>
  <text x="72" y="74" class="k">Flagship project</text>
  <text x="72" y="118" class="h">DevS69 SDETKit: from release confidence to reliability intelligence</text>
  <text x="72" y="152" class="p">A local-first platform direction: collect evidence, extract failures, keep risky work review-first, prove outcomes, and remember what happened.</text>

  <path d="M132 268H1148" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>

  <g transform="translate(90 206)">
    <rect x="0" y="0" width="170" height="128" rx="18" fill="#0F172A" stroke="#334155"/>
    <circle cx="28" cy="30" r="14" fill="#38BDF8"/><text x="23" y="35" class="num">1</text>
    <text x="52" y="36" class="t">Evidence Core</text>
    <text x="22" y="72" class="s">logs · commands · CI metadata</text>
    <text x="22" y="96" class="s">artifacts · proof surfaces</text>
  </g>
  <g transform="translate(286 206)">
    <rect x="0" y="0" width="190" height="128" rx="18" fill="#0F172A" stroke="#334155"/>
    <circle cx="28" cy="30" r="14" fill="#60A5FA"/><text x="23" y="35" class="num">2</text>
    <text x="52" y="36" class="t">FailureVector</text>
    <text x="22" y="72" class="s">first real failure</text>
    <text x="22" y="96" class="s">class · scope · risk</text>
  </g>
  <g transform="translate(502 206)">
    <rect x="0" y="0" width="170" height="128" rx="18" fill="#0F172A" stroke="#334155"/>
    <circle cx="28" cy="30" r="14" fill="#22C55E"/><text x="23" y="35" class="num">3</text>
    <text x="52" y="36" class="t">SafetyGate</text>
    <text x="22" y="72" class="s">review-first unknowns</text>
    <text x="22" y="96" class="s">scope boundaries</text>
  </g>
  <g transform="translate(698 206)">
    <rect x="0" y="0" width="182" height="128" rx="18" fill="#0F172A" stroke="#334155"/>
    <circle cx="28" cy="30" r="14" fill="#A78BFA"/><text x="23" y="35" class="num">4</text>
    <text x="52" y="36" class="t">Trajectory</text>
    <text x="22" y="72" class="s">action → response</text>
    <text x="22" y="96" class="s">diagnosis → proof</text>
  </g>
  <g transform="translate(906 206)">
    <rect x="0" y="0" width="192" height="128" rx="18" fill="#0F172A" stroke="#334155"/>
    <circle cx="28" cy="30" r="14" fill="#FBBF24"/><text x="23" y="35" class="num">5</text>
    <text x="52" y="36" class="t">Verifier</text>
    <text x="22" y="72" class="s">anti-cheat checks</text>
    <text x="22" y="96" class="s">proof integrity</text>
  </g>
  <g transform="translate(1124 206)">
    <rect x="0" y="0" width="70" height="128" rx="18" fill="#0F172A" stroke="#334155"/>
    <circle cx="35" cy="30" r="14" fill="#F59E0B"/><text x="30" y="35" class="num">6</text>
    <text x="18" y="72" class="s">PR</text>
    <text x="13" y="96" class="s">Report</text>
  </g>

  <rect x="72" y="396" width="1136" height="58" rx="18" fill="#020617" opacity="0.55" stroke="#1E293B"/>
  <text x="104" y="432" class="p">Execution rule: build local deterministic contracts first; defer cloud queues, dashboards, and broad autonomous patching until verifier-protected patterns are proven.</text>
</svg>
