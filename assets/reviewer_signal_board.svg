<svg width="1400" height="430" viewBox="0 0 1400 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reviewer signal board">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1400" y2="430"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
  <rect width="1400" height="430" rx="30" fill="url(#bg)"/>
  <text x="70" y="75" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial" font-size="36" font-weight="850">Reviewer Signal Board</text>
  <text x="70" y="112" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="18">The fast-read version of what I bring to engineering teams and AI-evaluation workflows.</text>
  <g>
    <rect x="70" y="155" width="290" height="190" rx="24" fill="#111827" stroke="#38BDF8"/>
    <text x="100" y="205" fill="#BAE6FD" font-family="Inter, Segoe UI, Arial" font-size="22" font-weight="800">01 · Reproduce</text>
    <text x="100" y="245" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial" font-size="17">I start from executable behavior, not assumptions.</text>
    <text x="100" y="290" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="15">clone · run · compare · isolate</text>
    <rect x="390" y="155" width="290" height="190" rx="24" fill="#111827" stroke="#A78BFA"/>
    <text x="420" y="205" fill="#DDD6FE" font-family="Inter, Segoe UI, Arial" font-size="22" font-weight="800">02 · Evaluate</text>
    <text x="420" y="245" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial" font-size="17">I check task logic, hidden cases, and rubric fit.</text>
    <text x="420" y="290" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="15">expected output · edge cases · risk</text>
    <rect x="710" y="155" width="290" height="190" rx="24" fill="#111827" stroke="#22C55E"/>
    <text x="740" y="205" fill="#BBF7D0" font-family="Inter, Segoe UI, Arial" font-size="22" font-weight="800">03 · Prove</text>
    <text x="740" y="245" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial" font-size="17">I value focused proof over confident claims.</text>
    <text x="740" y="290" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="15">pytest · CI · artifacts · reports</text>
    <rect x="1030" y="155" width="300" height="190" rx="24" fill="#111827" stroke="#F59E0B"/>
    <text x="1060" y="205" fill="#FDE68A" font-family="Inter, Segoe UI, Arial" font-size="22" font-weight="800">04 · Report</text>
    <text x="1060" y="245" fill="#E5E7EB" font-family="Inter, Segoe UI, Arial" font-size="17">I make the next action clear for humans.</text>
    <text x="1060" y="290" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="15">root cause · scope · verification</text>
  </g>
  <rect x="70" y="370" width="1260" height="1" fill="#334155"/>
  <text x="70" y="400" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial" font-size="16">Signal: SDET mindset + AI evaluation discipline + coding benchmark practice + evidence-first repository review.</text>
</svg>
