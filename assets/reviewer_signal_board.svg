<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Reviewer signal board</title>
  <desc id="desc">A quick signal board for recruiters and technical reviewers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="560"><stop stop-color="#07111F"/><stop offset="1" stop-color="#080B19"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1600" height="560" rx="34" fill="url(#bg)"/>
  <rect x="30" y="30" width="1540" height="500" rx="28" stroke="#7FE7FF" stroke-opacity="0.16"/>
  <text x="76" y="92" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="850">Reviewer Signal Board</text>
  <text x="76" y="126" fill="#96A9CC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">What a reviewer should understand in the first thirty seconds.</text>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(76 178)">
      <rect width="330" height="250" rx="24" fill="#0D172A" stroke="#58DFFF" stroke-opacity="0.32"/>
      <text x="28" y="48" fill="#58DFFF" font-size="18" font-weight="800" letter-spacing="2">ROLE SIGNAL</text>
      <text x="28" y="92" fill="#FFFFFF" font-size="26" font-weight="850">Python SDET</text>
      <text x="28" y="128" fill="#D7E1F7" font-size="19">test reliability, QA automation,</text>
      <text x="28" y="156" fill="#D7E1F7" font-size="19">failure reproduction, evidence.</text>
      <text x="28" y="210" fill="#92A6CA" font-size="16">signal: practical engineering quality</text>
    </g>
    <g transform="translate(442 178)">
      <rect width="330" height="250" rx="24" fill="#101329" stroke="#BCA4FF" stroke-opacity="0.32"/>
      <text x="28" y="48" fill="#BCA4FF" font-size="18" font-weight="800" letter-spacing="2">AI EVALUATION</text>
      <text x="28" y="92" fill="#FFFFFF" font-size="26" font-weight="850">Code validation</text>
      <text x="28" y="128" fill="#E1D9FF" font-size="19">review model output, logic,</text>
      <text x="28" y="156" fill="#E1D9FF" font-size="19">rubrics, hidden edge cases.</text>
      <text x="28" y="210" fill="#98A6C9" font-size="16">signal: benchmark-grade review</text>
    </g>
    <g transform="translate(808 178)">
      <rect width="330" height="250" rx="24" fill="#111928" stroke="#FFB84D" stroke-opacity="0.36"/>
      <text x="28" y="48" fill="#FFB84D" font-size="18" font-weight="800" letter-spacing="2">FLAGSHIP</text>
      <text x="28" y="92" fill="#FFFFFF" font-size="26" font-weight="850">DevS69 SDETKit</text>
      <text x="28" y="128" fill="#FFF0DB" font-size="19">release confidence, CI proof,</text>
      <text x="28" y="156" fill="#FFF0DB" font-size="19">diagnosis and safety gates.</text>
      <text x="28" y="210" fill="#A5B3CA" font-size="16">signal: owned product direction</text>
    </g>
    <g transform="translate(1174 178)">
      <rect width="330" height="250" rx="24" fill="#0D1821" stroke="#63FFB6" stroke-opacity="0.26"/>
      <text x="28" y="48" fill="#63FFB6" font-size="18" font-weight="800" letter-spacing="2">PRACTICE</text>
      <text x="28" y="92" fill="#FFFFFF" font-size="26" font-weight="850">LeetCode system</text>
      <text x="28" y="128" fill="#DDFCED" font-size="19">Python, Pandas, TypeScript</text>
      <text x="28" y="156" fill="#DDFCED" font-size="19">with hidden-test discipline.</text>
      <text x="28" y="210" fill="#90A8BE" font-size="16">signal: algorithmic habits</text>
    </g>
  </g>
</svg>
