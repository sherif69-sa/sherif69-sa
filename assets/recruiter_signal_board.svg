<svg width="1280" height="410" viewBox="0 0 1280 410" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Recruiter signal board</title>
  <desc id="desc">A clean board explaining what a reviewer should notice in the portfolio.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
  <rect width="1280" height="410" rx="24" fill="url(#bg)"/>
  <text x="56" y="68" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="900" fill="#f8fafc">Reviewer Signal Board</text>
  <text x="56" y="102" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#94a3b8">What the profile is designed to communicate in the first two minutes.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(56 148)"><rect width="360" height="172" rx="22" fill="#020617" stroke="#38bdf8" stroke-opacity="0.42"/><text x="24" y="42" font-size="20" font-weight="850" fill="#f8fafc">01 Real SDET mindset</text><text x="24" y="82" font-size="15" fill="#cbd5e1">I validate behavior with tests, proof,</text><text x="24" y="108" font-size="15" fill="#cbd5e1">logs, and reproducible commands.</text><text x="24" y="142" font-size="14" font-weight="800" fill="#38bdf8">signal: evidence before confidence</text></g>
    <g transform="translate(460 148)"><rect width="360" height="172" rx="22" fill="#020617" stroke="#22c55e" stroke-opacity="0.42"/><text x="24" y="42" font-size="20" font-weight="850" fill="#f8fafc">02 AI evaluation fit</text><text x="24" y="82" font-size="15" fill="#cbd5e1">I review generated code/output against</text><text x="24" y="108" font-size="15" fill="#cbd5e1">rubrics, hidden cases, and source truth.</text><text x="24" y="142" font-size="14" font-weight="800" fill="#22c55e">signal: judgment under ambiguity</text></g>
    <g transform="translate(864 148)"><rect width="360" height="172" rx="22" fill="#020617" stroke="#f59e0b" stroke-opacity="0.45"/><text x="24" y="42" font-size="20" font-weight="850" fill="#f8fafc">03 Product owner arc</text><text x="24" y="82" font-size="15" fill="#cbd5e1">DevS69 SDETKit shows long-term</text><text x="24" y="108" font-size="15" fill="#cbd5e1">reliability-platform thinking.</text><text x="24" y="142" font-size="14" font-weight="800" fill="#f59e0b">signal: roadmap + execution</text></g>
  </g>
</svg>
