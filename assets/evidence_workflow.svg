<svg width="1400" height="390" viewBox="0 0 1400 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Evidence workflow">
  <rect width="1400" height="390" rx="30" fill="#08111F"/>
  <text x="70" y="72" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial" font-size="34" font-weight="850">Evidence Workflow</text>
  <text x="70" y="108" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="18">How I move from a vague task or failing output to a reviewable result.</text>
  <g stroke="#334155" stroke-width="2"><path d="M190 220 H1210"/></g>
  <g>
    <rect x="70" y="170" width="185" height="100" rx="22" fill="#111827" stroke="#38BDF8"/>
    <text x="101" y="213" fill="#BAE6FD" font-family="Inter, Segoe UI, Arial" font-size="19" font-weight="800">Understand</text>
    <text x="101" y="242" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="13">task contract</text>
    <rect x="300" y="170" width="185" height="100" rx="22" fill="#111827" stroke="#A78BFA"/>
    <text x="336" y="213" fill="#DDD6FE" font-family="Inter, Segoe UI, Arial" font-size="19" font-weight="800">Reproduce</text>
    <text x="336" y="242" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="13">local behavior</text>
    <rect x="530" y="170" width="185" height="100" rx="22" fill="#111827" stroke="#F59E0B"/>
    <text x="577" y="213" fill="#FDE68A" font-family="Inter, Segoe UI, Arial" font-size="19" font-weight="800">Inspect</text>
    <text x="570" y="242" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="13">source + tests</text>
    <rect x="760" y="170" width="185" height="100" rx="22" fill="#111827" stroke="#22C55E"/>
    <text x="812" y="213" fill="#BBF7D0" font-family="Inter, Segoe UI, Arial" font-size="19" font-weight="800">Validate</text>
    <text x="806" y="242" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="13">focused proof</text>
    <rect x="990" y="170" width="185" height="100" rx="22" fill="#111827" stroke="#38BDF8"/>
    <text x="1030" y="213" fill="#BAE6FD" font-family="Inter, Segoe UI, Arial" font-size="19" font-weight="800">Explain</text>
    <text x="1017" y="242" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="13">root cause + risk</text>
    <rect x="1205" y="170" width="125" height="100" rx="22" fill="#111827" stroke="#A78BFA"/>
    <text x="1231" y="213" fill="#DDD6FE" font-family="Inter, Segoe UI, Arial" font-size="19" font-weight="800">Report</text>
    <text x="1225" y="242" fill="#94A3B8" font-family="Inter, Segoe UI, Arial" font-size="13">next action</text>
  </g>
</svg>
