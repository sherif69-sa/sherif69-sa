<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Evidence workflow</title>
  <desc id="desc">The working method from task contract to documented evidence.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500"><stop stop-color="#070B18"/><stop offset="1" stop-color="#0A1626"/></linearGradient></defs>
  <rect width="1600" height="500" rx="34" fill="url(#bg)"/>
  <rect x="30" y="30" width="1540" height="440" rx="28" stroke="#8CDFFF" stroke-opacity="0.15"/>
  <text x="76" y="92" fill="#FFFFFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="850">Evidence Workflow</text>
  <text x="76" y="126" fill="#96A9CC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">How I move from a task description to a reviewable engineering decision.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <path d="M170 282H1430" stroke="#6CE7FF" stroke-opacity="0.22" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(92 208)"><circle cx="74" cy="74" r="62" fill="#0D172A" stroke="#5BE2FF" stroke-opacity="0.36"/><text x="44" y="68" fill="#5BE2FF" font-size="18" font-weight="800">01</text><text x="25" y="98" fill="#FFF" font-size="18" font-weight="800">Contract</text></g>
    <g transform="translate(344 208)"><circle cx="74" cy="74" r="62" fill="#101329" stroke="#BCA4FF" stroke-opacity="0.34"/><text x="44" y="68" fill="#BCA4FF" font-size="18" font-weight="800">02</text><text x="29" y="98" fill="#FFF" font-size="18" font-weight="800">Reproduce</text></g>
    <g transform="translate(596 208)"><circle cx="74" cy="74" r="62" fill="#111928" stroke="#FFB84D" stroke-opacity="0.36"/><text x="44" y="68" fill="#FFB84D" font-size="18" font-weight="800">03</text><text x="36" y="98" fill="#FFF" font-size="18" font-weight="800">Inspect</text></g>
    <g transform="translate(848 208)"><circle cx="74" cy="74" r="62" fill="#0D1821" stroke="#66FFB8" stroke-opacity="0.28"/><text x="44" y="68" fill="#66FFB8" font-size="18" font-weight="800">04</text><text x="49" y="98" fill="#FFF" font-size="18" font-weight="800">Test</text></g>
    <g transform="translate(1100 208)"><circle cx="74" cy="74" r="62" fill="#0C1327" stroke="#C8D6FF" stroke-opacity="0.28"/><text x="44" y="68" fill="#C8D6FF" font-size="18" font-weight="800">05</text><text x="36" y="98" fill="#FFF" font-size="18" font-weight="800">Report</text></g>
    <g transform="translate(1352 208)"><circle cx="74" cy="74" r="62" fill="#0B111F" stroke="#FFFFFF" stroke-opacity="0.20"/><text x="44" y="68" fill="#E8EEFF" font-size="18" font-weight="800">06</text><text x="43" y="98" fill="#FFF" font-size="18" font-weight="800">Proof</text></g>
